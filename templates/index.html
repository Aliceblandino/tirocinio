<!DOCTYPE html>
<html lang="it" class="h-100" data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>uni(S)UD - Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
    <style>
      html, body {
        height: 100%;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        background: radial-gradient(circle at top, #3730a3 0%, #1e1b4b 55%, #14121f 100%);
        text-align: center;
        font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
        animation: cover-fade-in 0.5s ease both;
      }
      @keyframes cover-fade-in {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .cover-container {
        max-width: 42em;
      }
      form input {
        margin-bottom: 10px;
        transition: box-shadow 0.2s ease;
      }
      form input:focus {
        box-shadow: 0 0 0 0.2rem rgba(79, 70, 229, 0.35);
      }
      .nav-masthead .nav-link {
        transition: opacity 0.15s ease, transform 0.15s ease;
      }
      .nav-masthead .nav-link:hover {
        opacity: 1;
        transform: translateY(-1px);
      }
      .btn-login {
        background: #fff;
        color: #3730a3;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      .btn-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        color: #3730a3;
      }
    </style>
  </head>

  <body class="d-flex h-100 text-center text-bg-dark">
    <div class="cover-container d-flex w-100 h-100 p-3 mx-auto flex-column">
      <header class="mb-auto">
        <div>
          <h3 class="float-md-start mb-0">uni(S)UD</h3>
          <nav class="nav nav-masthead justify-content-center float-md-end">
            <a class="nav-link fw-bold py-1 px-0 active" href="/">Home</a>
            <a class="nav-link fw-bold py-1 px-0" href="/dashboard">Dashboard</a>
          </nav>
        </div>
      </header>

      <main class="px-3">
        <h1>Benvenuto!</h1>
        <p class="lead">Effettua il login per accedere alla dashboard</p>

        <!-- 🔹 FORM DI LOGIN -->
        <form method="POST" action="/">
          {% if error %}
          <div class="alert alert-danger py-2">{{ error }}</div>
          {% endif %}

          <div class="form-floating mb-2">
            <input
              type="text"
              class="form-control"
              id="email"
              name="email"
              placeholder="Email"
              required
            >
            <label for="email">Email</label>
          </div>

          <div class="form-floating mb-3">
            <input
              type="password"
              class="form-control"
              id="password"
              name="password"
              placeholder="Password"
              required
            >
            <label for="password">Password</label>
          </div>

          <button class="btn btn-lg btn-login fw-bold border-white" type="submit">
            Accedi
          </button>
        </form>
      </main>

      <footer class="mt-auto text-white-50">
        <p>Dashboard Statistiche Esami</p>
      </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
